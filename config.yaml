# 사진 자동 분류 설정
# watch_folder 를 null 로 두면 실행 시 실제 바탕화면 경로를 찾아
# <바탕화면>/Photos 를 사용한다 (OneDrive 리다이렉트 대응).
watch_folder: null
max_long_edge: 3840
jpeg_quality: 90
# 블러 임계값 (Laplacian variance, 이하이면 blur 판정) — 측정 모드별로 분리.
# 2026-08-25 실사진 161장 그리드 서치 결과 조합 (총오류 13: 놓침 7, 오탐 1)
blur_threshold_face: 8      # 얼굴 검출 시 (얼굴 크롭 기준)
blur_threshold_person: 30   # 인물 세그멘테이션 영역 보조 지표 (배경만 선명한 사진 잡음)
blur_threshold_center: 120  # 얼굴·인물 모두 미검출 시 (중앙 60% 기준)
# EAR 임계값 (이하이면 눈 감음 판정). 실측: 감은 눈 0.135~0.153, 뜬 눈 최소 0.201
ear_threshold: 0.17
keep_originals: true    # 원본은 항상 originals/ 로 이동 보관 (삭제 금지 원칙상 false 여도 삭제하지 않음)
strip_gps_exif: false   # GPS 포함 EXIF 전부 유지 (true 로 바꾸면 위치정보 제거)
